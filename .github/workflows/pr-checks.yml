# 工作流名称：展示在 GitHub Actions 列表中
name: PR Checks
# 触发条件：在 PR 创建/更新等事件发生时触发
on:
  # PR 事件
  pull_request:
    # 仅在这些 PR 行为发生时运行
    types: [opened, synchronize, reopened, ready_for_review]
# 权限声明：仅读取内容，不修改任何内容
permissions:
  # 仅需读取仓库内容以便 checkout 
  contents: read
# 并发控制：避免同一 PR/ref 重复跑多次
concurrency: 
  # 并发分组：同一 workflow + 同一 ref 归为一组
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  # 新的运行开始时取消旧的进行中运行
  cancel-in-progress: true

jobs:
  # 作业名称 
  lint:
    # 跳过 Draft PR (草稿 PR 不跑 CI)
    if: ${{ github.event.pull_request.draft == false }}
    # 运行环境：Ubuntu 22.04
    # 可选：其他环境如 macOS, Windows 等
    runs-on: ubuntu-latest
    # 作业步骤: 按顺序执行
    steps:
      # 步骤名称 Checkout
      - name: Checkout
        # 拉取仓库代码（PR 代码）
        uses: actions/checkout@v4
      # 步骤名称 Setup Node
      - name: Setup Node
        # 安装并配置 Node.js
        uses: actions/setup-node@v4 
        # setup-node 输入参数
        with:
          node-version: '22.14.0'
          cache: 'npm'
      # 步骤名称 Install Dependencies
      - name: Install Dependencies
        run: npm install --frozen-lockfile
      # 步骤名称 Typecheck
      - name: Typecheck
        run: npm run ts
